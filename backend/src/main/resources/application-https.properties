# Perfil opcional para testar o sistema (com câmera) a partir de outro dispositivo na
# mesma rede, como o celular do operador. Navegadores só liberam acesso à câmera em
# conexão segura (HTTPS) ou em "localhost" — por isso, ao testar pelo celular via IP
# de rede, backend e frontend precisam servir HTTPS.
#
# Ative com: mvn spring-boot:run -Dspring-boot.run.profiles=https
#
# Requer um keystore local em backend/dev-cert/dev-keystore.p12, gerado a partir de um
# certificado autoassinado (não versionado no Git — gere o seu com openssl, apontando o
# SAN para o IP da sua máquina na rede local).

server.ssl.enabled=true
server.ssl.key-store=file:./dev-cert/dev-keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=vivamais123
server.ssl.key-alias=vivamais
