spring.application.name=vivamais-backend
server.port=${PORT:8080}

# Banco de dados H2 persistido em arquivo local na pasta data
spring.datasource.url=jdbc:h2:file:./data/vivamaisdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# HikariCP Pool otimizado para container
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=5000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Tomcat Threads e Timeouts otimizados para menor consumo de memória e latência rápida
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.connection-timeout=5000

# H2 Console (desabilitado em produção para economizar RAM)
spring.h2.console.enabled=false

# Jackson JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo

# Compressão HTTP (gzip) das respostas da API — reduz o tráfego em conexões lentas
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=512

# Balança de precificação (leitura de etiqueta por código de barras) — layout EAN-13:
# 1 dígito indicador + N dígitos de código do produto + N dígitos de valor em centavos + 1 dígito verificador
vivamais.balanca.digito-indicador=2
vivamais.balanca.tamanho-codigo-produto=5
vivamais.balanca.tamanho-valor-centavos=6
