<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <!-- Filtro de relevo e sombra -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="greenLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <linearGradient id="amberLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="greenText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e824c"/>
      <stop offset="100%" stop-color="#145a32"/>
    </linearGradient>
  </defs>

  <!-- Arco Dourado Envolvente -->
  <path d="M 65,240 C 30,170 35,90 135,45 C 230,0 350,15 445,75" 
        fill="none" stroke="url(#goldGradient)" stroke-width="9" stroke-linecap="round" filter="url(#subtleShadow)"/>

  <!-- Folha Verde (Esquerda) -->
  <g filter="url(#subtleShadow)">
    <path d="M 245,120 C 230,95 180,50 145,65 C 130,105 160,140 245,120 Z" 
          fill="url(#greenLeaf)" stroke="#ffffff" stroke-width="4"/>
    <!-- Nervura Branca -->
    <path d="M 148,67 Q 195,95 240,118" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Folha Âmbar/Dourada (Direita) -->
  <g filter="url(#subtleShadow)">
    <path d="M 252,118 C 265,95 275,35 295,45 C 315,75 295,120 252,118 Z" 
          fill="url(#amberLeaf)" stroke="#ffffff" stroke-width="3.5"/>
    <!-- Nervura Branca -->
    <path d="M 293,48 Q 278,85 254,116" 
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Texto VivaMais estilizado -->
  <!-- Contorno Branco de Relevo -->
  <text x="250" y="195" 
        font-family="'Playfair Display', 'Merriweather', 'Georgia', serif" 
        font-size="82" 
        font-weight="900" 
        letter-spacing="0.5"
        text-anchor="middle" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#subtleShadow)">VivaMais</text>

  <!-- Preenchimento Verde Principal -->
  <text x="250" y="195" 
        font-family="'Playfair Display', 'Merriweather', 'Georgia', serif" 
        font-size="82" 
        font-weight="900" 
        letter-spacing="0.5"
        text-anchor="middle" 
        fill="url(#greenText)">VivaMais</text>

  <!-- Subtítulo Produtos Naturais -->
  <text x="250" y="225" 
        font-family="'Inter', 'Segoe UI', sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="5"
        text-anchor="middle" 
        fill="#15803d">PRODUTOS NATURAIS</text>
</svg>
